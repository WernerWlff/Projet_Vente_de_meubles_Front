<nav class="bg-indigo-600 text-white p-3 shadow-md">
  <div class="container mx-auto flex justify-between items-center">
    <a
    [routerLink]="['/frontPage']"
    class="px-3 py-1.5 text-xl font-bold bg-transparent hover:bg-indigo-700 rounded-md transition-colors"
    >
      Accueil
    </a>
    <a
      [routerLink]="['/login']"
      class="px-3 py-1.5 text-sm bg-indigo-700 hover:bg-indigo-700 rounded-md transition-colors"
    >
      Se connecter
    </a>
  </div>
</nav>

<div class="bg-gray-100 p-6 mb-6">
  <div class="container mx-auto">
    <div class="flex flex-col md:flex-row gap-4 items-center mb-4">
      <input
        [(ngModel)]="searchQuery"
        placeholder="Rechercher par titre..."
        class="w-full md:w-64 px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500"
      />

      <div class="flex items-center gap-2">
        <label class="font-medium">Type :</label>
        <select
          [(ngModel)]="selectedType"
          class="px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500"
        >
          <option value="">Tous les types</option>
          <option *ngFor="let type of types" [value]="type">{{ type }}</option>
        </select>
      </div>

      <div class="flex flex-col gap-2 w-full md:w-96">
        <div class="flex justify-between">
          <span>Prix min : {{ prixMin || "0" }} €</span>
          <span>Prix max : {{ prixMax || "1000" }} €</span>
        </div>
        <div class="flex gap-4 items-center">
          <input
            type="range"
            [min]="0"
            [max]="1000"
            [step]="10"
            [(ngModel)]="prixMin"
            class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer"
          />
          <input
            type="range"
            [min]="0"
            [max]="1000"
            [step]="10"
            [(ngModel)]="prixMax"
            class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer"
          />
        </div>
      </div>

      <button
        (click)="resetFilters()"
        class="px-4 py-2 bg-gray-200 hover:bg-gray-300 rounded-md transition-colors"
      >
        Réinitialiser
      </button>
    </div>
  </div>
</div>

<div class="container mx-auto p-6">
  <div *ngIf="filteredFurnitures.length === 0" class="text-center text-gray-500 py-8">
    Aucun meuble ne correspond à vos critères.
  </div>

  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
    <div
      *ngFor="let furniture of filteredFurnitures"
      class="bg-white rounded-xl shadow-md overflow-hidden border border-gray-100 flex flex-col"
    >
      <!-- Image placeholder -->
      <div class="h-40 bg-gradient-to-r from-indigo-500 to-purple-500 flex items-center justify-center text-white text-sm font-medium">
        Photo à venir
      </div>

      <!-- Content -->
      <div class="p-4 flex-1 flex flex-col">
        <h3 class="text-lg font-semibold mb-1 text-gray-900 line-clamp-2">
          {{ furniture.title }}
        </h3>

        <p class="text-sm text-gray-500 mb-2">
          {{ furniture.description }}
        </p>

        <div class="mt-auto space-y-1 text-sm text-gray-700">
          <p>
            <span class="font-semibold">Type :</span>
            {{ furniture.type?.type || 'Sans type' }}
          </p>
          <p>
            <span class="font-semibold">Prix :</span>
            {{ furniture.price }} €
          </p>
        </div>
      </div>
    </div>
  </div>
</div>
