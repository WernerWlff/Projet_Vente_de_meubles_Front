<nav class="bg-indigo-600 text-white p-3 shadow-md">
  <div class="container mx-auto flex justify-between items-center">
    <a
    [routerLink]="['/frontPage']"
    class="px-3 py-1.5 text-xl font-bold bg-transparent hover:bg-indigo-700 rounded-md transition-colors"
    >
      Accueil
    </a>
    <a
      [routerLink]="['/login']"
      class="px-3 py-1.5 text-sm bg-indigo-700 hover:bg-indigo-700 rounded-md transition-colors"
    >
      Se connecter
    </a>
  </div>
</nav>

<div class="min-h-[calc(100vh-60px)] flex items-center justify-center bg-gray-50 py-4 px-4 sm:px-6 lg:px-8">
  <div class="w-full max-w-md space-y-4">
    <div>
      <h2 class="text-center text-2xl font-extrabold text-gray-900">
        Connexion
      </h2>
    </div>

    <div *ngIf="errorMessage" class="bg-red-100 border border-red-400 text-red-700 px-4 py-2 text-sm rounded relative">
      <span class="block sm:inline">{{ errorMessage }}</span>
    </div>

    <form [formGroup]="loginForm" class="space-y-4" (ngSubmit)="onSubmit()">
      <div class="space-y-3">
        <div class="space-y-1">
          <label for="email-address" class="sr-only">Adresse e-mail</label>
          <input
            id="email-address"
            name="email"
            type="email"
            formControlName="email"
            required
            class="appearance-none relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-500 text-gray-900 rounded-md focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 text-sm"
            placeholder="Adresse e-mail"
          />
          <div *ngIf="loginForm.get('email')?.invalid && (loginForm.get('email')?.dirty || loginForm.get('email')?.touched)" class="text-red-500 text-xs">
            L'adresse e-mail est requise.
          </div>
        </div>

        <div class="space-y-1">
          <label for="password" class="sr-only">Mot de passe</label>
          <input
            id="password"
            name="password"
            type="password"
            formControlName="password"
            required
            class="appearance-none relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-500 text-gray-900 rounded-md focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 text-sm"
            placeholder="Mot de passe"
          />
          <div *ngIf="loginForm.get('password')?.invalid && (loginForm.get('password')?.dirty || loginForm.get('password')?.touched)" class="text-red-500 text-xs">
            Le mot de passe est requis.
          </div>
        </div>
      </div>

      <div class="pt-2">
        <button
          type="submit"
          [disabled]="loginForm.invalid || loading"
          class="group relative w-full flex justify-center py-2 px-4 border border-transparent text-sm font-medium rounded-md text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 disabled:opacity-50 disabled:cursor-not-allowed"
        >
          <span *ngIf="!loading">Se connecter</span>
          <span *ngIf="loading" class="flex items-center justify-center">
            <svg class="animate-spin -ml-1 mr-2 h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            Connexion en cours...
          </span>
        </button>
      </div>
    </form>
  </div>
</div>
